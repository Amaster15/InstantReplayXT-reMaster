name: Build Windows and Linux (OBS 31 baseline)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - name: Build bundled clip trimmer
        shell: msys2 {0}
        run: python scripts/build_trimmer.py
      - name: Install VLC for live playback tests
        shell: pwsh
        run: |
          $vlcInstaller = Join-Path $env:RUNNER_TEMP "vlc-3.0.24-win64.exe"
          curl.exe --fail --location --retry 3 --output $vlcInstaller https://download.videolan.org/pub/videolan/vlc/3.0.24/win64/vlc-3.0.24-win64.exe
          if ($LASTEXITCODE -ne 0) { throw "VLC download failed" }
          $expectedHash = "d711e1e1fe52052748c39080c7dce63f6b7e4c315efedf1774a3f1957b782ff3"
          if ((Get-FileHash $vlcInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) { throw "VLC checksum mismatch" }
          $vlcInstall = Start-Process -FilePath $vlcInstaller -ArgumentList "/S" -Wait -PassThru
          if ($vlcInstall.ExitCode -ne 0) { throw "VLC install failed: $($vlcInstall.ExitCode)" }
          if (!(Test-Path "$env:ProgramFiles/VideoLAN/VLC/libvlc.dll")) { throw "64-bit VLC was not installed" }
      - name: Build OBS 31 SDK and Windows x64 plugin
        run: python scripts/build.py
      - name: Build and test installer
        run: |
          python scripts/package_installers.py --platform windows
          python tests/test_installers.py
      - uses: actions/upload-artifact@v4
        with:
          name: InstantReplayXT-windows-x64-obs31
          path: artifacts/*
          if-no-files-found: error
  linux:
    # Ubuntu 24.04 provides Qt 6.4, avoiding newer Qt symbols in baseline binaries.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config qt6-base-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xinput-dev libxext-dev libgl1-mesa-dev libegl1-mesa-dev libjansson-dev libsimde-dev uthash-dev uuid-dev libglib2.0-dev zlib1g-dev xvfb vlc
      - name: Build OBS 31 SDK, run tests and package
        run: xvfb-run -a python3 scripts/build.py --test
      - name: Build and test installer
        run: |
          python3 scripts/package_installers.py --platform linux
          python3 tests/test_installers.py
      - uses: actions/upload-artifact@v4
        with:
          name: InstantReplayXT-linux-x64-obs31
          path: artifacts/*
          if-no-files-found: error
