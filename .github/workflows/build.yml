name: Build Windows and Linux (OBS 31 baseline)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build OBS 31 SDK and Windows x64 plugin
        run: python scripts/build.py
      - name: Build and test installer
        run: |
          python scripts/package_installers.py --platform windows
          python tests/test_installers.py
      - uses: actions/upload-artifact@v4
        with:
          name: InstantReplayXT-windows-x64-obs31
          path: artifacts/*
          if-no-files-found: error
  linux:
    # Ubuntu 24.04 provides Qt 6.4, avoiding newer Qt symbols in baseline binaries.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config qt6-base-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xinput-dev libxext-dev libgl1-mesa-dev libegl1-mesa-dev libjansson-dev libsimde-dev uthash-dev uuid-dev libglib2.0-dev zlib1g-dev xvfb
      - name: Build OBS 31 SDK, run tests and package
        run: xvfb-run -a python3 scripts/build.py --test
      - name: Build and test installer
        run: |
          python3 scripts/package_installers.py --platform linux
          python3 tests/test_installers.py
      - uses: actions/upload-artifact@v4
        with:
          name: InstantReplayXT-linux-x64-obs31
          path: artifacts/*
          if-no-files-found: error
